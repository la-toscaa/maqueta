<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La tosca</title>
    <link rel="icon" src = "imagenes/8666627_twitch_icon.png" type="png/icon">
    <link rel="stylesheet" href="estilos/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <body>
        <header>
          <div class="logo">
            <img src="imagenes/8666627_twitch_icon.png" alt="Logo de la tienda">
            <h1>La tosca</h1>
          </div>
          <div class="menu">
            <button>Menú</button>
            <div class="menu-contenido">
              <a href="#">Inicio</a>
              <a href="#">Productos</a>
              <a href="#">Contacto</a>
            </div>
          </div>
        </header>
      
        <div class="buscador">
          <input type="text" placeholder="Buscar productos...">
          <button>Buscar</button>
        </div>
      
        <h2 class="carrusel-titulo">novedades</h2>
        
        <div id="carouselExampleIndicators" class="carousel slide mx-auto" data-bs-ride="carousel" data-bs-interval="3000" style="max-width: 350px;">
          <div class="carrusel-inner">
            <div class="carousel-item active">
              <img src="imagenes/buzodehombre.jpeg" class="d-block w-100 " alt="">
            </div>
            <div class="carousel-item">
              <img src="imagenes/buzodehombre1.jpeg" class="d-block w-100" alt="">
            </div>
            <div class="carousel-item">
              <img src="imagenes/buzodehombre2.jpeg" class="d-block w-100" alt="">
            </div>
          </div>
          <div class="carousel-indicators">
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1" aria-label="Slide 2"></button>
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2" aria-label="Slide 3"></button>
          </div>
          <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Anterior</span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Siguiente</span>
          </button>
        </div>
      
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
</body>
</html>
